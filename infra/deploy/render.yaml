services:
  - type: web
    name: atelier-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py seed_lessons
    startCommand: python manage.py migrate && python manage.py seed_lessons && gunicorn --pythonpath backend config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      # Must list every hostname the backend is served from. Django answers all
      # requests with an HTML 400 when the incoming Host is missing here, which
      # the frontend reports as "server returned a web page instead of JSON".
      # Render/Vercel/Hugging Face hostnames (RENDER_EXTERNAL_HOSTNAME,
      # VERCEL_URL, SPACE_HOST) and FRONTEND_URL are added automatically by
      # config/settings.py, so this only needs custom domains.
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,open-source-contribution-atelier.vercel.app
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: SECRET_KEY
        value: lJ5d3ke8O2HyKD35WtQJ6hvuDWwUl9TCw-GdyO1F_sM_wnwBky7Wfl0q-w4r0Diz1cg
      - key: FIELD_ENCRYPTION_KEY
        value: 6lsX7camrNKsPueBKfs6zuZiwKKp9rVTo3mkJM3jHQI=

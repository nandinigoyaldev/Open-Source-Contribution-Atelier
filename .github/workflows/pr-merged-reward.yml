name: Merged PR Reward & Contributor Certificate

on:
  pull_request_target:
    types: [closed]

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  celebrate-merged-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Post Contributor Certificate & Update Leaderboard
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const author = pr.user.login;

            // Count merged PRs from the API so pagination and search failures are explicit.
            let mergedCount = 0;
            let recentMergedCount = 0;
            try {
              const searchRes = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:pr is:merged author:${author}`
              });

              const mergedPRs = searchRes.data.items || [];
              mergedCount = searchRes.data.total_count;

              // Calculate 7-Day Hot Streak
              const sevenDaysAgo = new Date();
              sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);

              recentMergedCount = mergedPRs.filter(p => {
                const closedAt = new Date(p.closed_at || p.updated_at);
                return closedAt >= sevenDaysAgo;
              }).length;
            } catch (e) {
              core.setFailed(`Could not calculate contributor totals: ${e.message}`);
              return;
            }

            const isHotStreak = recentMergedCount >= 2;

            // Check PR labels or content for NSoC '26
            const prLabels = (pr.labels || []).map(l => (typeof l === 'string' ? l : l.name));
            const isNsoc = prLabels.includes('NSOC26') || /nsoc26/i.test(pr.title || '') || /nsoc26/i.test(pr.body || '');
            let nsocLevel = '';
            let earnedPoints = 25;

            if (prLabels.includes('LEVEL3') || /LEVEL3/i.test(pr.body || '') || /LEVEL3/i.test(pr.title || '')) {
              nsocLevel = 'LEVEL3';
              earnedPoints = 50;
            } else if (prLabels.includes('LEVEL2') || /LEVEL2/i.test(pr.body || '') || /LEVEL2/i.test(pr.title || '')) {
              nsocLevel = 'LEVEL2';
              earnedPoints = 25;
            } else if (prLabels.includes('LEVEL1') || /LEVEL1/i.test(pr.body || '') || /LEVEL1/i.test(pr.title || '')) {
              nsocLevel = 'LEVEL1';
              earnedPoints = 10;
            }

            // Determine Contributor Tier
            let tierName = '🥉 Bronze Contributor';
            let tierBadge = 'https://img.shields.io/badge/Contributor_Tier-Bronze_🥉-cd7f32?style=for-the-badge&logo=github&logoColor=white';

            if (mergedCount >= 10) {
              tierName = '💎 Diamond Contributor';
              tierBadge = 'https://img.shields.io/badge/Contributor_Tier-Diamond_💎-b9f2ff?style=for-the-badge&logo=github&logoColor=white';
            } else if (mergedCount >= 5) {
              tierName = '🥇 Gold Contributor';
              tierBadge = 'https://img.shields.io/badge/Contributor_Tier-Gold_🥇-ffd700?style=for-the-badge&logo=github&logoColor=white';
            } else if (mergedCount >= 3) {
              tierName = '🥈 Silver Contributor';
              tierBadge = 'https://img.shields.io/badge/Contributor_Tier-Silver_🥈-c0c0c0?style=for-the-badge&logo=github&logoColor=white';
            }

            const streakBadge = isHotStreak
              ? ' [![Streak Badge](https://img.shields.io/badge/Streak-⚡_Hot_Contributor-ff4500?style=for-the-badge&logo=github&logoColor=white)](https://github.com/' + owner + '/' + repo + '/blob/main/LEADERBOARD.md)'
              : '';

            const streakNotice = isHotStreak
              ? `\n🔥 **7-Day Hot Streak Active!** You've merged **${recentMergedCount} PRs** in the past 7 days! Keep up the momentum!`
              : '';

            const nsocBadge = isNsoc
              ? `  [![NSoC '26](https://img.shields.io/badge/NSoC_'26-Verified_Contributor-00b4d8?style=for-the-badge&logo=codeforces&logoColor=white)](https://www.nsoc.in/projects)` +
                (nsocLevel ? `  [![${nsocLevel}](https://img.shields.io/badge/NSoC_Difficulty-${nsocLevel}-0e8a16?style=for-the-badge)](https://www.nsoc.in/projects)` : '')
              : '';

            const nsocNotice = isNsoc
              ? `\n❄️ **NSoC '26 Contribution Verified!** Awarded **${earnedPoints} Points** (\`${nsocLevel || 'General'}\`) for Nexus Spring / Winter of Code 2026!`
              : '';

            const tweetText = encodeURIComponent(`🎉 Excited to share that my Pull Request #${pr.number} ("${pr.title}") has been merged into Open-Source Contribution Atelier! 🚀\n\nCheck out the project: https://github.com/${owner}/${repo}`);
            const linkedinText = encodeURIComponent(`https://github.com/${owner}/${repo}/pull/${pr.number}`);

            const certBody = [
              `# 🎉 Your contribution just shipped, @${author}!`,
              ``,
              `Your pull request [**#${pr.number} — ${pr.title}**](https://github.com/${owner}/${repo}/pull/${pr.number}) is now part of \`main\`. Thank you for making the Atelier better!`,
              ``,
              `## 🏅 Your contributor card`,
              ``,
              `[![Open Source Contributor](https://img.shields.io/badge/Open_Source-Contributor-4ECDC4?style=for-the-badge&logo=github&logoColor=white)](https://github.com/${owner}/${repo}/pull/${pr.number})  [![${tierName}](${tierBadge})](https://github.com/${owner}/${repo}/blob/main/LEADERBOARD.md)${streakBadge}${nsocBadge}`,
              ``,
              `**${mergedCount} merged contribution${mergedCount === 1 ? '' : 's'}** · **${tierName}**${streakNotice}${nsocNotice}`,
              ``,
              `<details>`,
              `<summary>✨ Copy a compact badge for your profile</summary>`,
              ``,
              `\`\`\`markdown`,
              `[![Open Source Contributor](https://img.shields.io/badge/Open_Source-Contributor-4ECDC4?style=for-the-badge&logo=github&logoColor=white)](https://github.com/${owner}/${repo}/pull/${pr.number})`,
              `[![${tierName}](${tierBadge})](https://github.com/${owner}/${repo}/blob/main/LEADERBOARD.md)`,
              isNsoc ? `[![NSoC '26 Contributor](https://img.shields.io/badge/NSoC_'26-Verified_Contributor-00b4d8?style=for-the-badge&logo=codeforces&logoColor=white)](https://www.nsoc.in/projects)` : '',
              `\`\`\``,
              ``,
              `</details>`,
              ``,
              `### 🚀 Want another small win?`,
              `Pick an issue that matches your interests, or help review someone else's PR. Every thoughtful improvement counts.`,
              ``,
              `Share your milestone: [X](https://twitter.com/intent/tweet?text=${tweetText}) · [LinkedIn](https://www.linkedin.com/sharing/share-offsite/?url=${linkedinText})`,
              ``,
              `> Keep learning, keep building, and keep the open-source door open. 💛`
            ].filter(Boolean).join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: certBody
            });
            console.log(`Posted merged PR certificate for @${author} with Tier ${tierName}, Streak=${isHotStreak}, NSoC=${isNsoc}`);

            // Update LEADERBOARD.md
            try {
              let content = fs.readFileSync('LEADERBOARD.md', 'utf8');
              const today = new Date().toISOString().split('T')[0];
              const points = mergedCount * 25;
              const streakText = isHotStreak ? '⚡ Hot Streak' : 'Active';

              if (content.includes(`@${author}`)) {
                const newRow = `| 1 | @${author} | ${tierName} ${isHotStreak ? '⚡' : ''} | ${mergedCount} | ${points} | ${today} |`;
                const lines = content.split('\n');
                const rowIndex = lines.findIndex(line => line.startsWith(`| 1 | @${author} |`));
                if (rowIndex >= 0) lines[rowIndex] = newRow;
                content = lines.join('\n');
              } else {
                const newRow = `| 1 | @${author} | ${tierName} ${isHotStreak ? '⚡' : ''} | ${mergedCount} | ${points} | ${today} |\n`;
                content = content.replace('---', `${newRow}\n---`);
              }

              fs.writeFileSync('LEADERBOARD.md', content, 'utf8');
              console.log(`Updated LEADERBOARD.md for @${author}`);
            } catch (e) {
              console.warn(`Could not update LEADERBOARD.md:`, e);
            }

      - name: Commit & Push Leaderboard Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update contributor leaderboard [skip ci]" && git push)

name: Frontend Unit Tests

# A dedicated, fast job for the Vitest unit tests so contributors see test results on their own,
# not hidden behind a lint or type-check failure in quality-gates.yml.
#
# It runs the "unit" Vitest project (jsdom). The "storybook" project in vite.config.ts needs a real
# browser and runs separately, so it is not part of this job.
#
# Reproduce a failure locally:   cd frontend && npm run test:unit
# Run one file:                  cd frontend && npx vitest run --project unit src/path/to/file.test.tsx

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
  workflow_dispatch:

concurrency:
  group: frontend-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # package.json "engines" is ">=20": the oldest supported version and the one the other workflows use.
        node: ["20", "22"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Run unit tests
        # "github-actions" turns each failure into an annotation on the file in the pull request.
        run: npm run test:unit -- --reporter=default --reporter=github-actions
      - name: How to reproduce
        if: failure()
        run: |
          {
            echo "### Frontend unit tests failed"
            echo
            echo "Run them locally with the same command:"
            echo
            echo '```bash'
            echo "cd frontend && npm ci && npm run test:unit"
            echo '```'
            echo
            echo "Failing tests are listed as annotations on the pull request and in the log of the previous step."
          } >> "$GITHUB_STEP_SUMMARY"

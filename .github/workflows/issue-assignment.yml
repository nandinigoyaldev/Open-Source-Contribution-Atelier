name: Issue Assignment & Quality Triage

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  auto-label-and-triage:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Check Quality & Label Issue
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = (issue.title || '').trim();
            const body = (issue.body || '').trim();
            const issueText = `${title}\n${body}`;
            const labels = new Set((issue.labels || []).map(label => label.name.toLowerCase()));
            const hasNsocCheckbox = /- \[[xX]\][^\n]*\bnsoc\s*['` ]?26\b/i.test(body);

            // NSoC '26 Auto-Labeling (Compulsory: NSOC26 and LEVEL1/LEVEL2/LEVEL3)
            const isNsoc = /\[?nsoc26\]?/i.test(issueText) || /\bnsoc\b/i.test(issueText) || hasNsocCheckbox;
            if (isNsoc) {
              const labelsToAdd = ['nsoc26'];

              // Detect level
              if (labels.has('level1')) {
                labelsToAdd.push('LEVEL1');
              } else if (labels.has('level3')) {
                labelsToAdd.push('LEVEL3');
              } else if (labels.has('level2')) {
                labelsToAdd.push('LEVEL2');
              } else if (/\b(level-?1|beginner|typo|spelling|copy|documentation|docs|readme|style|styling|label|text)\b/i.test(issueText)) {
                labelsToAdd.push('LEVEL1');
              } else if (/\b(level-?3|advanced|security|auth(?:entication|orization)?|database|migration|architecture|distributed|performance|scalab|integration|api|backend|deployment|workflow|audit)\b/i.test(issueText)) {
                labelsToAdd.push('LEVEL3');
              } else {
                labelsToAdd.push('LEVEL2');
              }

              // Ensure labels exist
              for (const lbl of labelsToAdd) {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name: lbl });
                } catch (e) {
                  const colors = {
                    NSOC26: '0075ca',
                    LEVEL1: '0e8a16',
                    LEVEL2: 'fbca04',
                    LEVEL3: 'd93f0b'
                  };
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: lbl,
                    color: colors[lbl] || '5319e7',
                    description: `NSoC '26 official label: ${lbl}`
                  });
                }
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: labelsToAdd
              });
              console.log(`Labeled issue #${issue.number} with NSoC labels: ${labelsToAdd.join(', ')}`);
            }

            // Assign the author immediately, except for the repository owner.
            if (issue.user?.login && issue.user.login.toLowerCase() !== owner.toLowerCase()) {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: issue.number,
                assignees: [issue.user.login]
              });
              console.log(`Assigned issue #${issue.number} to its author @${issue.user.login}.`);
            }

            // Low-Quality Issue Auto-Triage Check
            if (title.length < 10 || body.length < 30) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: 'needs-more-info' });
              } catch (e) {
                await github.rest.issues.createLabel({
                  owner, repo, name: 'needs-more-info', color: 'fef2c0', description: 'Requires additional details'
                });
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['needs-more-info'] });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `⚠️ @${issue.user.login}, thank you for creating this issue! Please provide additional details (e.g. reproduction steps, environment details, or problem description) so maintainers can review and assign it.`
              });
              console.log(`Labeled issue #${issue.number} as needs-more-info due to brevity.`);
            }

  handle-issue-assignment:
    if: github.event_name == 'issue_comment' && github.event.action == 'created'
    runs-on: ubuntu-latest
    steps:
      - name: Process Claim / Unclaim Commands
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = context.payload.comment;
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Ignore PR comments
            if (issue.pull_request) return;

            // Ignore bot comments
            if (comment.user.type === 'Bot' || comment.user.login.endsWith('[bot]')) return;

            const commenter = comment.user.login;
            const commentText = (comment.body || '').toLowerCase();
            const existingAssignees = (issue.assignees || []).map(a => a.login);

            // Handle /unclaim or !unclaim command
            if (commentText.includes('/unclaim') || commentText.includes('!unclaim')) {
              if (existingAssignees.includes(commenter)) {
                await github.rest.issues.removeAssignees({
                  owner,
                  repo,
                  issue_number: issue.number,
                  assignees: [commenter]
                });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `🛠️ @${commenter} has **unclaimed** this issue. It is now open for other contributors.`
                });
              }
              return;
            }

            // Check if comment is claiming the issue
            const isClaimCommand = /\b(\/claim|!claim|\/assign|!assign|claim)\b/i.test(commentText) ||
                                 /\b(can i work|can i take|can i claim|i want to work|i'd like to work|please assign|can i be assigned|assign me(?: this)? issue|assign this issue to me|i want to contribute|can i contribute)\b/i.test(commentText);

            if (!isClaimCommand) return;

            // Check if issue is already assigned to a non-author user
            const nonAuthorAssignees = existingAssignees.filter(a => a !== issue.user.login);
            if (nonAuthorAssignees.length > 0) {
              if (!existingAssignees.includes(commenter)) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `⚠️ @${commenter}, this issue is already assigned to @${nonAuthorAssignees.join(', @')}.`
                });
              }
              return;
            }

            // Assign the user
            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: issue.number,
                assignees: [commenter]
              });

              const issueLabels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name));
              const isNsocIssue = issueLabels.includes('NSOC26');
              let levelBadge = '';
              let pointsText = '';

              if (issueLabels.includes('LEVEL3')) {
                levelBadge = '🔴 `LEVEL3`';
                pointsText = '50 XP / Points';
              } else if (issueLabels.includes('LEVEL2')) {
                levelBadge = '🟡 `LEVEL2`';
                pointsText = '25 XP / Points';
              } else if (issueLabels.includes('LEVEL1')) {
                levelBadge = '🟢 `LEVEL1`';
                pointsText = '10 XP / Points';
              }

              let assignmentBody;
              if (isNsocIssue) {
                assignmentBody = [
                  `### ❄️ Assigned to @${commenter} for NSoC '26! 🚀`,
                  ``,
                  `Hey @${commenter}, this issue has been successfully assigned to you for **Nexus Spring / Winter of Code 2026**!`,
                  ``,
                  `| Metric | Details |`,
                  `|---|---|`,
                  `| **Program** | ❄️ NSoC '26 (\`NSOC26\`) |`,
                  `| **Difficulty Tier** | ${levelBadge || 'General'} |`,
                  `| **Reward Value** | ${pointsText || 'Standard Points'} |`,
                  `| **Activity Policy** | ⏰ First update or draft PR within **48 hours** |`,
                  ``,
                  `#### 📋 NSoC Contributor Checklist:`,
                  `1. **Create Branch**: \`git checkout -b feat/nsoc-${issue.number}-<short-name>\``,
                  `2. **Verify Locally**: \`pytest\` in \`backend/\` and \`npm test && npm run build\` in \`frontend/\``,
                  `3. **Link Issue in PR**: Include \`Fixes #${issue.number}\` in your PR description so points are auto-awarded upon merge.`,
                  `4. **Active Rotation**: If no update is received within 72 hours, the issue will automatically unassign to allow others to participate.`,
                  ``,
                  `Need help? Join the [Community Discussions](https://github.com/${owner}/${repo}/discussions) or ask right here! 💡`,
                  ``,
                  `Happy coding! ✨ — @${owner}`
                ].join('\n');
              } else {
                assignmentBody = [
                  `### 🚀 Assigned to @${commenter}! 🎉`,
                  ``,
                  `Issue successfully assigned to @${commenter}!`,
                  `1. Please link this issue in your Pull Request description using \`Fixes #${issue.number}\`.`,
                  `2. Run local tests before requesting review (\`pytest\` / \`npm test\`).`,
                  ``,
                  `Happy coding! 🎉 — @${owner}`
                ].join('\n');
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: assignmentBody
              });
            } catch (err) {
              console.error(`Failed to assign issue #${issue.number} to ${commenter}:`, err);
            }

name: Conventional Commits

# Enforce conventional commit messages (feat/fix/chore/docs/...) on every PR
# and push to keep history clean and drive the release-drafter changelog.
# Use the unprivileged PR event when reading commit history and PR config.

on:
  pull_request:
    types: [opened, edited, synchronize]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@baffd3c16c570c0a26bf89be729b81bb796e9bd5 # v3.1.4
        with:
          configFile: ./commitlint.config.js

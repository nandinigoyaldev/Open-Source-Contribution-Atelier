name: Documentation
description: Propose improvements or fixes to project documentation
title: '[DOCS]: '
labels:
  - documentation
body:
  - type: textarea
    id: description
    attributes:
      label: Documentation Description
      description: Describe what documentation needs to be added or updated.
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Affected Files or Sections
      description: Mention specific doc files or README sections affected.
    validations:
      required: false

  - type: dropdown
    id: program
    attributes:
      label: Open Source Program Track
      description: Is this documentation request part of a seasonal open source program?
      options:
        - "None / General Community"
        - "❄️ NSoC '26 (Nexus Spring / Winter of Code)"
    validations:
      required: false

  - type: checkboxes
    id: nsoc26
    attributes:
      label: NSoC '26 participation
      options:
        - label: Add the `nsoc26` label to this issue
          required: false

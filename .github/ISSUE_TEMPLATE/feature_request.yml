name: Feature Request
description: Suggest an idea or new feature for the project
title: '[FEAT]: '
labels:
  - enhancement
body:
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of the proposed feature.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working.
    validations:
      required: true

  - type: dropdown
    id: program
    attributes:
      label: Open Source Program Track
      description: Is this proposed feature part of a seasonal open source program?
      options:
        - "None / General Community"
        - "❄️ NSoC '26 (Nexus Spring / Winter of Code)"
    validations:
      required: false

  - type: checkboxes
    id: nsoc26
    attributes:
      label: NSoC '26 participation
      options:
        - label: Add the `nsoc26` label to this issue
          required: false

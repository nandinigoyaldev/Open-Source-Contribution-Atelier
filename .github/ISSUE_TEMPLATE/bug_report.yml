name: Bug Report
description: Report a bug to help us improve the project
title: '[BUG]: '
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected & Actual Behavior
      description: What you expected to happen vs what actually happened.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: OS, Python/Node version, Browser, etc.
    validations:
      required: false

  - type: dropdown
    id: program
    attributes:
      label: Open Source Program Track
      description: Is this issue filed as part of a seasonal program?
      options:
        - "None / General Community"
        - "❄️ NSoC '26 (Nexus Spring / Winter of Code)"
    validations:
      required: false

  - type: checkboxes
    id: nsoc26
    attributes:
      label: NSoC '26 participation
      options:
        - label: Add the `nsoc26` label to this issue
          required: false
